# Fiesta ESDF 地图构建参数配置
fiesta:
  ros__parameters:
    # 基本参数
    resolution: 0.1
    update_esdf_every_n_sec: 0.1

    # Hash Table 参数 (当定义 HASH_TABLE 时使用)
    reserved_size: 1000000

    # Array 参数 (当未定义 HASH_TABLE 时使用)
    # 注意：如果使用哈希表实现，这些参数会被忽略
    lx: -20.0
    ly: -20.0
    lz: -1.6
    rx: 20.0
    ry: 20.0
    rz: 2.0

    # raycasting 参数
    min_ray_length: 0.5
    max_ray_length: 5.0
    ray_cast_num_thread: 0

    # 相机内参
    center_x: 322.4773574193643
    center_y: 237.07634648111778
    focal_x: 384.45808939187248
    focal_y: 383.9827556965439

    # 概率网格图参数 (当定义 PROBABILISTIC 时使用)
    p_hit: 0.70
    p_miss: 0.35
    p_min: 0.12
    p_max: 0.97
    p_occ: 0.80

    # 全局/局部地图参数
    global_map: false
    global_update: false
    global_vis: false
    radius_x: 3.0
    radius_y: 3.0
    radius_z: 1.5

    # 深度滤波参数
    use_depth_filter: true
    depth_filter_tolerance: 0.1
    depth_filter_max_dist: 10.0
    depth_filter_min_dist: 0.1
    depth_filter_margin: 0

    # 可视化参数
    visualize_every_n_updates: 10
    slice_vis_max_dist: 2.0
    slice_vis_level: 1.6
    vis_lower_bound: 0.0
    vis_upper_bound: 10.0

    # 注意：以下参数在C++代码中有使用
    # 它们将使用代码中的默认值
    # T_B_C_ 和 T_D_B_ 在代码中直接设置，不通过参数配置